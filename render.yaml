# Render Blueprint — CLIENT DEMO configuration.
# Demo mode: sandbox checkout (no real money), signups auto-verified (no email provider needed),
# products run in labelled "Simulated" mode unless an AI key is added.
# For the real launch: PAYMENT_PROVIDER=stripe + Stripe keys, remove ALLOW_SANDBOX_PAYMENTS and
# AUTO_VERIFY_EMAIL, add RESEND_API_KEY/MAIL_FROM (see PROGRESS.md).
# The JSON data store is single-instance: keep numInstances at 1 until the Supabase adapter is wired.
# To keep data across restarts, switch to plan: starter and add a disk (mountPath /var/data, DATA_DIR=/var/data).
services:
  - type: web
    name: agentforge-ai
    runtime: node
    plan: free               # Free has no persistent disk: data resets when the service sleeps (15 min idle) or redeploys.
                             # DEMO_LOGIN_* below is recreated on every start so the demo login always works.
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATA_DIR
        value: /tmp/agentforge-data
      - key: APP_URL
        sync: false          # e.g. https://agentforge-ai.onrender.com or your own domain (no trailing slash)
      - key: ADMIN_EMAILS
        sync: false          # put the DEMO_LOGIN_EMAIL here too if the demo login should see /admin
      - key: DEMO_LOGIN_EMAIL
        sync: false
      - key: DEMO_LOGIN_PASSWORD
        sync: false          # at least 10 characters
      - key: SESSION_SECRET
        generateValue: true
      - key: LICENSE_SIGNING_SECRET
        generateValue: true
      - key: DOWNLOAD_SIGNING_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: SANDBOX_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: ALLOW_SANDBOX_PAYMENTS
        value: "true"
      - key: AUTO_VERIFY_EMAIL
        value: "true"
      # Optional for the demo: add one AI key in the Render dashboard to show real output instead of "Simulated".
      - key: OPENAI_API_KEY
        sync: false
      - key: DEMO_ALLOW_PROVIDERS
        value: "false"
