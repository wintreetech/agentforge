# Development stack. NOTE: not executed in the authoring environment (Docker unavailable); see PROGRESS.md.
services:
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["3100:3100"]
    env_file: .env
    environment:
      APP_URL: http://localhost:3100
      REDIS_URL: redis://redis:6379
      PRODUCTS_DIR: /app/products
      DATA_DIR: /data
    volumes: ["web-data:/data"]
    depends_on: [redis]

  db:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: agentforge }
    ports: ["5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    profiles: ["workflows"]
    volumes: ["n8n-data:/home/node/.n8n"]

volumes:
  web-data:
  db-data:
  n8n-data:
